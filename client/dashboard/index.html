<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS720 Drone Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2a;
    --text: #e0e0e8;
    --text-dim: #6a6a7a;
    --accent: #4a9eff;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
  }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .relay-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .relay-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--red);
    transition: background 0.3s;
  }
  .relay-dot.ready { background: var(--green); }
  .relay-dot.connecting, .relay-dot.wifi_connecting, .relay-dot.drone_connecting {
    background: var(--yellow);
  }
  .main {
    display: grid;
    grid-template-columns: 1fr 340px;
    height: calc(100vh - 49px);
  }
  .video-panel {
    position: relative;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .video-panel canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform: scaleY(-1);
  }
  .video-overlay {
    position: absolute;
    color: var(--text-dim);
    font-size: 13px;
    pointer-events: none;
  }
  .video-overlay.hidden { display: none; }
  .fps-counter {
    position: absolute;
    top: 8px; left: 10px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
    background: rgba(0, 0, 0, 0.5);
    padding: 3px 7px;
    border-radius: 3px;
    z-index: 10;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
    display: none;
  }
  .gateway-banner {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.3s;
    opacity: 0;
  }
  .gateway-banner.visible { opacity: 1; }
  .gateway-banner.scanning {
    background: rgba(248, 113, 113, 0.9);
    color: #fff;
  }
  .gateway-banner.wifi_connecting,
  .gateway-banner.drone_connecting {
    background: rgba(251, 191, 36, 0.85);
    color: #000;
  }
  .telemetry-panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
  }
  .telem-section { margin-bottom: 20px; }
  .telem-section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .telem-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .telem-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .telem-item.wide { grid-column: span 2; }
  .telem-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .telem-value {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.2;
  }
  .telem-unit {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-dim);
    margin-left: 2px;
  }
  .battery-good { color: var(--green); }
  .battery-warn { color: var(--yellow); }
  .battery-low { color: var(--red); }
  .mode-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    background: rgba(74, 158, 255, 0.15);
    color: var(--accent);
  }
  .mode-badge.flying {
    background: rgba(52, 211, 153, 0.15);
    color: var(--green);
  }
  .telemetry-panel.stale .telem-value,
  .telemetry-panel.stale .mode-badge { opacity: 0.35; }
  .last-update {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 16px;
    transition: color 0.3s;
  }
  .last-update.stale { color: var(--yellow); }
</style>
</head>
<body>

<div class="topbar">
  <h1>HS720 Dashboard</h1>
  <div class="relay-status">
    <div class="relay-dot" id="relay-dot"></div>
    <span id="relay-text">Connecting...</span>
  </div>
</div>

<div class="main">
  <div class="video-panel">
    <span class="video-overlay" id="video-overlay">No video feed</span>
    <div class="gateway-banner" id="gateway-banner"></div>
    <div class="fps-counter" id="fps-counter"></div>
    <canvas id="video-canvas"></canvas>
  </div>

  <div class="telemetry-panel">
    <div class="telem-section">
      <h2>Flight Mode</h2>
      <div class="mode-badge" id="mode">--</div>
    </div>

    <div class="telem-section">
      <h2>Attitude</h2>
      <div class="telem-grid">
        <div class="telem-item">
          <div class="telem-label">Altitude</div>
          <div class="telem-value"><span id="altitude">--</span><span class="telem-unit">m</span></div>
        </div>
        <div class="telem-item">
          <div class="telem-label">Distance</div>
          <div class="telem-value"><span id="distance">--</span><span class="telem-unit">m</span></div>
        </div>
        <div class="telem-item">
          <div class="telem-label">Speed</div>
          <div class="telem-value"><span id="speed">--</span><span class="telem-unit">m/s</span></div>
        </div>
        <div class="telem-item">
          <div class="telem-label">Yaw</div>
          <div class="telem-value"><span id="yaw">--</span><span class="telem-unit">&deg;</span></div>
        </div>
      </div>
    </div>

    <div class="telem-section">
      <h2>Battery</h2>
      <div class="telem-grid">
        <div class="telem-item wide">
          <div class="telem-label">Voltage</div>
          <div class="telem-value" id="voltage-wrap"><span id="voltage">--</span><span class="telem-unit">V</span></div>
        </div>
      </div>
    </div>

    <div class="telem-section">
      <h2>GPS</h2>
      <div class="telem-grid">
        <div class="telem-item">
          <div class="telem-label">Satellites</div>
          <div class="telem-value"><span id="satellites">--</span></div>
        </div>
        <div class="telem-item">
          <div class="telem-label">Latitude</div>
          <div class="telem-value" style="font-size:14px"><span id="lat">--</span></div>
        </div>
        <div class="telem-item">
          <div class="telem-label">Longitude</div>
          <div class="telem-value" style="font-size:14px"><span id="lon">--</span></div>
        </div>
      </div>
    </div>

    <div class="last-update">Last update: <span id="last-update">--</span></div>
  </div>
</div>

<script>
// ---- State (single source of truth) ----
const state = {
  relay: 'unknown',    // gateway relay state
  sse: true,           // SSE connected
  telemetry: null,     // latest telemetry object, or null
  telemetryAt: 0,      // Date.now() of last telemetry
  videoActive: false,  // WebCodecs is receiving frames
};

const GATEWAY_LABELS = {
  scanning:          'Gateway scanning for drone WiFi...',
  wifi_connecting:   'Gateway connecting to drone WiFi...',
  drone_connecting:  'Gateway authenticating with drone...',
};

// ---- Derived state + render ----
function droneConnected() { return state.relay === 'ready'; }

function telemetryStale() {
  if (!droneConnected()) return true;
  if (!state.telemetryAt) return false;
  return Date.now() - state.telemetryAt > 3000;
}

const $ = (id) => document.getElementById(id);

function render() {
  // Relay status
  $('relay-dot').className = 'relay-dot ' + state.relay;
  $('relay-text').textContent = state.sse ? state.relay : 'SSE disconnected';

  // Gateway banner
  const banner = $('gateway-banner');
  if (!droneConnected()) {
    banner.textContent = GATEWAY_LABELS[state.relay] || 'Gateway: ' + state.relay;
    banner.className = 'gateway-banner visible ' + state.relay;
  } else {
    banner.className = 'gateway-banner';
  }

  // Video overlay
  const overlay = $('video-overlay');
  if (state.videoActive) {
    overlay.classList.add('hidden');
  } else {
    overlay.classList.remove('hidden');
    overlay.textContent = droneConnected() ? 'Waiting for video...' : 'No video feed';
  }

  // Telemetry staleness
  const stale = telemetryStale();
  document.querySelector('.telemetry-panel').classList.toggle('stale', stale);
  const lastEl = $('last-update');
  lastEl.classList.toggle('stale', stale);
  if (!state.telemetryAt) {
    lastEl.textContent = '--';
  } else if (stale) {
    lastEl.textContent = Math.round((Date.now() - state.telemetryAt) / 1000) + 's ago';
  }

  // Telemetry values
  const t = state.telemetry;
  if (t) {
    const mode = $('mode');
    mode.textContent = t.mode_name;
    mode.className = 'mode-badge' + (t.flying ? ' flying' : '');
    $('altitude').textContent = t.altitude;
    $('distance').textContent = t.distance;
    $('speed').textContent = t.speed.toFixed(1);
    $('yaw').textContent = t.yaw;
    $('voltage').textContent = t.voltage.toFixed(1);
    $('voltage-wrap').className = 'telem-value ' + (
      t.voltage > 7 ? 'battery-good' : t.voltage > 6.5 ? 'battery-warn' : 'battery-low');
    $('satellites').textContent = t.satellites;
    $('lat').textContent = t.lat ? t.lat.toFixed(7) : '--';
    $('lon').textContent = t.lon ? t.lon.toFixed(7) : '--';
  }
}

// ---- Events (update state, then render) ----
const es = new EventSource('/telemetry');

es.onmessage = function(e) {
  state.telemetry = JSON.parse(e.data);
  state.telemetryAt = Date.now();
  $('last-update').textContent = new Date().toLocaleTimeString();
  render();
};

es.addEventListener('relay', function(e) {
  state.relay = JSON.parse(e.data).state || 'unknown';
  render();
});

es.onerror = function() { state.sse = false; render(); };
es.onopen  = function() { state.sse = true;  render(); };

// Tick for staleness counter
setInterval(render, 1000);

// Initial render (default state)
render();

// ---- H.264 Video via WebSocket + WebCodecs ----
(function() {
  if (typeof VideoDecoder === 'undefined') {
    console.error('[video] VideoDecoder API not available');
    $('video-overlay').textContent = 'WebCodecs not supported — use Chrome/Edge';
    return;
  }

  const canvas = $('video-canvas');
  const ctx = canvas.getContext('2d');
  let decoder = null;
  let currentCodec = '';  // saved for reconfiguration after reset
  let frameCount = 0;
  let framesDecoded = 0;
  let framesDropped = 0;
  const fpsSamples = [];
  let lastFrameTime = 0;
  const fpsEl = $('fps-counter');

  // Decoder config: prefer-software avoids Main profile reorder buffer
  // (hardware decoders buffer 4+ frames waiting for B-frames that never come)
  const decoderConfig = {
    optimizeForLatency: true,
    hardwareAcceleration: 'prefer-software',
  };

  function createDecoder() {
    return new VideoDecoder({
      output: function(frame) {
        framesDecoded++;
        if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
          canvas.width = frame.displayWidth;
          canvas.height = frame.displayHeight;
          console.log('[video] Canvas: ' + canvas.width + 'x' + canvas.height);
        }
        ctx.drawImage(frame, 0, 0);
        frame.close();
        // FPS tracking
        const now = performance.now();
        if (lastFrameTime) fpsSamples.push(now - lastFrameTime);
        lastFrameTime = now;
        if (fpsSamples.length > 30) fpsSamples.shift();
        if (fpsSamples.length >= 2) {
          const avg = fpsSamples.reduce((a, b) => a + b) / fpsSamples.length;
          const fps = 1000 / avg;
          fpsEl.style.display = 'block';
          let text = fps.toFixed(0) + ' fps';
          if (framesDropped > 0) text += ' (' + framesDropped + ' dropped)';
          fpsEl.textContent = text;
        }
        if (!state.videoActive) {
          state.videoActive = true;
          console.log('[video] First frame rendered');
          render();
        }
      },
      error: function(err) {
        console.error('[video] Decoder error:', err.message || err);
        // Decoder is permanently broken after error — recreate on next keyframe
        try { decoder.close(); } catch(_) {}
        decoder = null;
      }
    });
  }

  function connectVideo() {
    const url = 'ws://' + location.hostname + ':__WS_PORT__';
    console.log('[video] Connecting to', url);
    const ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';

    ws.onopen = function() {
      console.log('[video] WebSocket connected');
    };

    ws.onmessage = function(e) {
      const buf = new Uint8Array(e.data);
      if (buf.length < 2) return;
      const type = buf[0];
      const payload = buf.slice(1);

      if (type === 0x01) {
        // Config: codec string (UTF-8) + \x00 + avcC
        const nullIdx = payload.indexOf(0);
        if (nullIdx < 0) return;
        currentCodec = new TextDecoder().decode(payload.slice(0, nullIdx));
        console.log('[video] Config: codec=' + currentCodec + ', avcC=' + payload.slice(nullIdx + 1).length + 'B');

        if (decoder) { try { decoder.close(); } catch(_) {} }
        frameCount = 0;
        framesDecoded = 0;
        framesDropped = 0;
        fpsSamples.length = 0;
        lastFrameTime = 0;
        decoder = createDecoder();
        // No description — Annex B mode (start code-delimited)
        // SPS+PPS prepended to keyframes in the stream
        try {
          decoder.configure(Object.assign({ codec: currentCodec }, decoderConfig));
          console.log('[video] Decoder configured (Annex B, software), state=' + decoder.state);
        } catch (err) {
          console.error('[video] configure() failed:', err.message || err);
        }

      } else if (type === 0x02 || type === 0x03) {
        const isKey = type === 0x02;

        // On keyframe: if decoder is broken or backed up, reset and reconfigure
        // (scrcpy pattern — bounds maximum latency to one keyframe interval)
        if (isKey && decoder && decoder.state === 'configured' && decoder.decodeQueueSize > 0) {
          const skipped = decoder.decodeQueueSize;
          framesDropped += skipped;
          decoder.reset();
          decoder.configure(Object.assign({ codec: currentCodec }, decoderConfig));
          console.log('[video] Decoder reset on keyframe (skipped ' + skipped + ' queued)');
        }

        // If decoder died from error, recreate on keyframe
        if (isKey && (!decoder || decoder.state !== 'configured')) {
          decoder = createDecoder();
          decoder.configure(Object.assign({ codec: currentCodec }, decoderConfig));
          console.log('[video] Decoder recreated on keyframe');
        }

        if (!decoder || decoder.state !== 'configured') return;
        const kind = isKey ? 'key' : 'delta';
        const chunk = new EncodedVideoChunk({
          type: kind,
          timestamp: frameCount * 40000,  // 25fps = 40ms per frame in µs
          data: payload,
        });
        frameCount++;
        if (frameCount <= 3 || frameCount % 250 === 0) {
          console.log('[video] Chunk #' + frameCount + ': ' + kind + ' ' + payload.length + 'B, queueSize=' + decoder.decodeQueueSize);
        }
        try {
          decoder.decode(chunk);
        } catch (err) {
          console.error('[video] decode() threw:', err.message || err);
        }
      }
    };

    ws.onclose = function(e) {
      console.log('[video] WebSocket closed: code=' + e.code + ' reason=' + (e.reason || '(none)'));
      state.videoActive = false;
      fpsEl.style.display = 'none';
      render();
      setTimeout(connectVideo, 2000);
    };

    ws.onerror = function() {};
  }

  connectVideo();
})();
</script>

</body>
</html>
